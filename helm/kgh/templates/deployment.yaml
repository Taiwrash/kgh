apiVersion: apps/v1
kind: Deployment
metadata:
  name: kgh
  namespace: {{ .Values.namespace }}
  labels:
    app: kgh
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: kgh
  template:
    metadata:
      labels:
        app: kgh
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
      - name: controller
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.server.port }}
          protocol: TCP
        env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: kgh-secret
              key: github-token
        - name: WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: kgh-secret
              key: webhook-secret
        - name: SERVER_PORT
          value: {{ .Values.server.port | quote }}
        - name: NAMESPACE
          value: {{ .Values.namespace | quote }}
        {{- with .Values.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
