# Default values for kgh
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: taiwrash/kgh
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: "kgh"

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: LoadBalancer
  port: 80
  targetPort: 8082

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

# GitHub configuration
github:
  # GitHub Personal Access Token (leave empty for public repos)
  token: ""
  # Webhook secret (REQUIRED - generate with: openssl rand -hex 32)
  webhookSecret: ""

# Server configuration
server:
  port: 8082

# Kubernetes namespace to deploy resources to
namespace: default

# RBAC configuration
rbac:
  create: true
  # Grant cluster-wide permissions (required for GitOps)
  # Grant cluster-wide permissions (required for GitOps)
  clusterWide: true

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
